<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Outside?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #000;
      --surface:   #111;
      --border:    #222;
      --border-hi: #444;
      --text:      #fff;
      --muted:     #666;
      --dim:       #333;
      --mono:      'Space Mono', monospace;
      --sans:      'Space Grotesk', system-ui, sans-serif;
    }

    html { background: var(--bg); color: var(--text); font-family: var(--sans); }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    /* ── top bar ── */
    .topbar {
      width: 100%;
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
    }
    .logo span { color: var(--muted); }

    /* ── search ── */
    .search-row {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 560px;
      margin: 32px 16px 0;
      border: 1px solid var(--border-hi);
    }
    .search-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 14px 18px;
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row button {
      background: var(--text);
      color: var(--bg);
      border: none;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .search-row button:hover { opacity: .8; }

    /* ── toggle ── */
    .toggle-wrap {
      display: flex;
      margin-top: 32px;
      border: 1px solid var(--border-hi);
    }
    .toggle-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 11px 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color .15s, background .15s;
    }
    .toggle-btn.active {
      background: var(--text);
      color: var(--bg);
    }
    .toggle-btn:not(.active):hover { color: var(--text); }

    /* ── main panel ── */
    .panel {
      width: 100%;
      max-width: 560px;
      margin: 28px 16px 0;
      display: none;
      flex-direction: column;
      gap: 1px;
      border: 1px solid var(--border);
    }
    .panel.visible { display: flex; }

    .section {
      background: var(--surface);
      padding: 28px 28px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: none; }

    /* ── location + date ── */
    .location-line {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .location-city {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .location-date {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ── big score ── */
    .score-section { text-align: left; }
    .score-number {
      font-family: var(--mono);
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .score-bar-track {
      height: 3px;
      background: var(--dim);
      margin: 16px 0 12px;
      width: 100%;
    }
    .score-bar-fill {
      height: 100%;
      background: var(--text);
      transition: width .6s cubic-bezier(.16,1,.3,1);
    }
    .score-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .score-verdict {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-top: 4px;
    }

    /* ── conditions grid ── */
    .conditions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin: 0 -28px -28px;
    }
    .cond-cell {
      background: var(--surface);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cond-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cond-value {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .cond-note {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .cond-note.good  { color: #fff; }
    .cond-note.ok    { color: #888; }
    .cond-note.bad   { color: #555; text-decoration: line-through; }

    /* ── factor breakdown ── */
    .factors-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .factor-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .factor-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .factor-dot.good { background: #fff; }
    .factor-dot.ok   { background: #666; }
    .factor-dot.bad  { background: #333; border: 1px solid #666; }
    .factor-name {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      width: 90px;
      flex-shrink: 0;
    }
    .factor-bar-track {
      flex: 1;
      height: 2px;
      background: var(--dim);
    }
    .factor-bar-fill {
      height: 100%;
      background: var(--text);
      transition: width .5s ease;
    }
    .factor-pct {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── section header ── */
    .section-header {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── Summary note ── */
    .summary-text {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #ccc;
    }

    /* ── 7-day forecast ── */
    .forecast-row {
      display: flex;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin: 0 -28px -28px;
      overflow-x: auto;
    }
    .forecast-day-cell {
      background: var(--surface);
      flex: 1;
      min-width: 60px;
      padding: 16px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .forecast-day-cell.best { background: #1a1a1a; }
    .fd-name {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .fd-emoji { font-size: 1.3rem; }
    .fd-score {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .fd-score.hi  { color: #fff; }
    .fd-score.mid { color: #888; }
    .fd-score.lo  { color: #444; }
    .fd-temp {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── loading / error ── */
    .status-line {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
    }
    .err-panel {
      width: 100%;
      max-width: 560px;
      margin: 20px 16px 0;
      padding: 18px 20px;
      border: 1px solid var(--border-hi);
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: none;
    }

    @media (max-width: 400px) {
      .section { padding: 22px 18px; }
      .conditions-grid { margin: 0 -18px -22px; }
      .forecast-row    { margin: 0 -18px -22px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">GO OUTSIDE? <span>// weather for athletes</span></div>
</div>

<div class="search-row">
  <input type="text" id="locInput" placeholder="City or location…" />
  <button id="searchBtn">Search</button>
</div>

<div class="toggle-wrap">
  <button class="toggle-btn active" data-mode="run" id="runBtn">
    <span>🏃</span> Run
  </button>
  <button class="toggle-btn" data-mode="bike" id="bikeBtn">
    <span>🚲</span> Bike
  </button>
</div>

<div id="errPanel" class="err-panel"></div>
<div id="statusLine" class="status-line" style="display:none;"></div>

<div id="panel" class="panel">

  <!-- Location + date -->
  <div class="section" style="padding-bottom:22px;">
    <div class="location-line">
      <span class="location-city" id="cityName">—</span>
      <span class="location-date" id="todayDate">—</span>
    </div>
  </div>

  <!-- Score -->
  <div class="section score-section">
    <div class="score-label" id="scoreLabel">OVERALL SCORE</div>
    <div class="score-number" id="scoreNum">—</div>
    <div class="score-bar-track">
      <div class="score-bar-fill" id="scoreBar" style="width:0%"></div>
    </div>
    <div class="score-verdict" id="scoreVerdict">—</div>

    <!-- Conditions grid flush to bottom of section -->
    <div class="conditions-grid" style="margin-top:24px;">
      <div class="cond-cell">
        <div class="cond-label">Temp</div>
        <div class="cond-value" id="cTemp">—</div>
        <div class="cond-note" id="cTempNote">—</div>
      </div>
      <div class="cond-cell">
        <div class="cond-label">Wind</div>
        <div class="cond-value" id="cWind">—</div>
        <div class="cond-note" id="cWindNote">—</div>
      </div>
      <div class="cond-cell">
        <div class="cond-label">Humidity</div>
        <div class="cond-value" id="cHum">—</div>
        <div class="cond-note" id="cHumNote">—</div>
      </div>
      <div class="cond-cell">
        <div class="cond-label">Conditions</div>
        <div class="cond-value" id="cCond">—</div>
        <div class="cond-note" id="cCondNote">—</div>
      </div>
    </div>
  </div>

  <!-- Factor breakdown -->
  <div class="section">
    <div class="section-header">What's affecting your score</div>
    <div class="factors-list" id="factorsList"></div>
  </div>

  <!-- Summary -->
  <div class="section">
    <div class="section-header">Summary</div>
    <div class="summary-text" id="summaryText">—</div>
  </div>

  <!-- 7-day forecast -->
  <div class="section">
    <div class="section-header">7-day outlook</div>
    <div class="forecast-row" id="forecastRow"></div>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let mode = 'run'; // 'run' | 'bike'
  let cachedGeo  = null;
  let cachedData = null;

  // ── WMO codes ────────────────────────────────────────────────────────────
  const WMO = {
    0:  { label: 'Clear',            emoji: '☀️',  wxScore: { run: 100, bike: 100 } },
    1:  { label: 'Mostly clear',     emoji: '🌤️', wxScore: { run: 97,  bike: 97  } },
    2:  { label: 'Partly cloudy',    emoji: '⛅',  wxScore: { run: 90,  bike: 88  } },
    3:  { label: 'Overcast',         emoji: '☁️',  wxScore: { run: 72,  bike: 68  } },
    45: { label: 'Foggy',            emoji: '🌫️', wxScore: { run: 42,  bike: 28  } },
    48: { label: 'Icy fog',          emoji: '🌫️', wxScore: { run: 30,  bike: 18  } },
    51: { label: 'Light drizzle',    emoji: '🌦️', wxScore: { run: 32,  bike: 22  } },
    53: { label: 'Drizzle',          emoji: '🌦️', wxScore: { run: 22,  bike: 14  } },
    55: { label: 'Heavy drizzle',    emoji: '🌧️', wxScore: { run: 15,  bike: 8   } },
    61: { label: 'Light rain',       emoji: '🌧️', wxScore: { run: 18,  bike: 10  } },
    63: { label: 'Rain',             emoji: '🌧️', wxScore: { run: 10,  bike: 6   } },
    65: { label: 'Heavy rain',       emoji: '🌧️', wxScore: { run: 5,   bike: 2   } },
    66: { label: 'Freezing rain',    emoji: '🌨️', wxScore: { run: 5,   bike: 2   } },
    67: { label: 'Heavy frz. rain',  emoji: '🌨️', wxScore: { run: 2,   bike: 1   } },
    71: { label: 'Light snow',       emoji: '🌨️', wxScore: { run: 28,  bike: 15  } },
    73: { label: 'Snow',             emoji: '❄️',  wxScore: { run: 18,  bike: 8   } },
    75: { label: 'Heavy snow',       emoji: '❄️',  wxScore: { run: 8,   bike: 3   } },
    77: { label: 'Snow grains',      emoji: '🌨️', wxScore: { run: 22,  bike: 10  } },
    80: { label: 'Rain showers',     emoji: '🌦️', wxScore: { run: 20,  bike: 12  } },
    81: { label: 'Rain showers',     emoji: '🌧️', wxScore: { run: 12,  bike: 7   } },
    82: { label: 'Violent showers',  emoji: '⛈️',  wxScore: { run: 4,   bike: 2   } },
    85: { label: 'Snow showers',     emoji: '🌨️', wxScore: { run: 18,  bike: 8   } },
    86: { label: 'Heavy snow showers', emoji: '❄️', wxScore: { run: 6,  bike: 3   } },
    95: { label: 'Thunderstorm',     emoji: '⛈️',  wxScore: { run: 0,   bike: 0   } },
    96: { label: 'T-storm + hail',   emoji: '⛈️',  wxScore: { run: 0,   bike: 0   } },
    99: { label: 'Severe T-storm',   emoji: '🌩️', wxScore: { run: 0,   bike: 0   } },
  };
  function wmo(code) { return WMO[code] || { label: 'Unknown', emoji: '🌡️', wxScore: { run: 50, bike: 50 } }; }

  // ── Scoring ──────────────────────────────────────────────────────────────
  function tempScore(t, m) {
    // Ideal: run 8-16°C, bike 14-22°C
    const [lo, hi] = m === 'run' ? [8, 16] : [14, 22];
    const spread = 8;
    if (t >= lo && t <= hi) return 100;
    const dist = t < lo ? lo - t : t - hi;
    return Math.max(0, Math.round(100 - dist * (100 / (spread * 2))));
  }

  function windScore(w, m) {
    // Bikers penalised harder for wind (headwind drag)
    if (m === 'run') {
      if (w <= 10) return 100;
      if (w <= 20) return Math.round(100 - (w - 10) * 2.5);
      if (w <= 35) return Math.round(75 - (w - 20) * 3);
      return Math.max(0, Math.round(30 - (w - 35) * 2));
    } else {
      if (w <= 12) return 100;
      if (w <= 24) return Math.round(100 - (w - 12) * 4);
      if (w <= 40) return Math.round(52 - (w - 24) * 3);
      return Math.max(0, Math.round(4 - (w - 40)));
    }
  }

  function humScore(h) {
    if (h <= 50) return 100;
    if (h <= 70) return Math.round(100 - (h - 50) * 2);
    return Math.max(20, Math.round(60 - (h - 70) * 1.5));
  }

  function calcScore(temp, wind, hum, wmoCode, m) {
    const ws  = wmo(wmoCode).wxScore[m];
    const ts  = tempScore(temp, m);
    const wns = windScore(wind, m);
    const hs  = humScore(hum);
    if (m === 'run') {
      return Math.round(ts * 0.32 + wns * 0.24 + ws * 0.32 + hs * 0.12);
    } else {
      return Math.round(ts * 0.28 + wns * 0.38 + ws * 0.28 + hs * 0.06);
    }
  }

  function calcDailyScore(tMax, tMin, wind, wmoCode, m) {
    const t = (tMax + tMin) / 2;
    return calcScore(t, wind, 60, wmoCode, m);
  }

  function verdict(s, m) {
    const act = m === 'run' ? 'run' : 'ride';
    if (s >= 88) return `Perfect ${act} day.`;
    if (s >= 72) return `Great day to ${act}.`;
    if (s >= 55) return `Decent. Could be worse.`;
    if (s >= 38) return `Tough conditions.`;
    if (s >= 20) return `Better to skip it.`;
    return `Stay home.`;
  }

  function ratingClass(s) {
    if (s >= 70) return 'hi';
    if (s >= 42) return 'mid';
    return 'lo';
  }

  function noteClass(v, goodAbove, badBelow) {
    if (v >= goodAbove) return 'good';
    if (v <= badBelow)  return 'bad';
    return 'ok';
  }

  // ── Plain-language summary ───────────────────────────────────────────────
  function summaryText(score, temp, wind, hum, wmoCode, m) {
    const act   = m === 'run' ? 'running' : 'cycling';
    const cond  = wmo(wmoCode).label.toLowerCase();
    const parts = [];

    if (score >= 88) {
      parts.push(`Conditions are excellent for ${act} today.`);
    } else if (score >= 68) {
      parts.push(`Good conditions for ${act}.`);
    } else if (score >= 45) {
      parts.push(`Passable conditions for ${act}, but not ideal.`);
    } else if (score >= 25) {
      parts.push(`Difficult conditions — consider rescheduling your ${m === 'run' ? 'run' : 'ride'}.`);
    } else {
      parts.push(`Poor conditions. Best to skip ${act} today.`);
    }

    // Specifics
    if (wmo(wmoCode).wxScore[m] < 35) parts.push(`${wmo(wmoCode).label} makes it hazardous.`);
    if (m === 'bike' && wind > 30) parts.push(`Wind at ${Math.round(wind)} km/h will create significant headwind resistance.`);
    if (m === 'run'  && wind > 25) parts.push(`Wind at ${Math.round(wind)} km/h will be noticeable.`);
    if (hum > 78) parts.push(`High humidity (${hum}%) will make effort feel harder.`);
    const [lo, hi] = m === 'run' ? [8, 16] : [14, 22];
    if (temp < lo - 4) parts.push(`Temperature is low — dress in layers.`);
    if (temp > hi + 6) parts.push(`Temperature is high — stay hydrated.`);

    return parts.join(' ');
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render() {
    if (!cachedData) return;
    const c    = cachedData.current;
    const d    = cachedData.daily;
    const m    = mode;
    const score = calcScore(c.temperature_2m, c.wind_speed_10m, c.relative_humidity_2m, c.weather_code, m);

    document.getElementById('scoreNum').textContent  = score;
    document.getElementById('scoreBar').style.width  = `${score}%`;
    document.getElementById('scoreVerdict').textContent = verdict(score, m);
    document.getElementById('scoreLabel').textContent   =
      `${m === 'run' ? 'RUN SCORE' : 'BIKE SCORE'} — TODAY`;

    // Condition chips
    document.getElementById('cTemp').textContent = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('cWind').textContent = `${Math.round(c.wind_speed_10m)} km/h`;
    document.getElementById('cHum').textContent  = `${c.relative_humidity_2m}%`;
    document.getElementById('cCond').textContent = wmo(c.weather_code).emoji;

    const idealTempLo = m === 'run' ? 8 : 14;
    const idealTempHi = m === 'run' ? 16 : 22;
    const t = c.temperature_2m;
    const w = c.wind_speed_10m;
    const h = c.relative_humidity_2m;

    function setNote(id, cls, txt) {
      const el = document.getElementById(id);
      el.textContent = txt;
      el.className = `cond-note ${cls}`;
    }
    setNote('cTempNote', t >= idealTempLo && t <= idealTempHi ? 'good' : t < 0 || t > 32 ? 'bad' : 'ok',
      t < idealTempLo ? 'a bit cold' : t > idealTempHi ? 'a bit warm' : 'ideal range');
    setNote('cWindNote', w <= 12 ? 'good' : w >= 35 ? 'bad' : 'ok',
      w <= 12 ? 'calm' : w <= 24 ? 'light breeze' : w <= 36 ? 'strong wind' : 'very windy');
    setNote('cHumNote', h <= 55 ? 'good' : h >= 80 ? 'bad' : 'ok',
      h <= 55 ? 'comfortable' : h <= 72 ? 'moderate' : 'high humidity');
    setNote('cCondNote', wmo(c.weather_code).wxScore[m] >= 70 ? 'good'
      : wmo(c.weather_code).wxScore[m] >= 35 ? 'ok' : 'bad',
      wmo(c.weather_code).label);

    // Factors
    const factors = m === 'run'
      ? [
          { name: 'Temperature', pct: tempScore(c.temperature_2m, m) },
          { name: 'Conditions',  pct: wmo(c.weather_code).wxScore[m] },
          { name: 'Wind',        pct: windScore(c.wind_speed_10m, m) },
          { name: 'Humidity',    pct: humScore(c.relative_humidity_2m) },
        ]
      : [
          { name: 'Wind',        pct: windScore(c.wind_speed_10m, m) },
          { name: 'Conditions',  pct: wmo(c.weather_code).wxScore[m] },
          { name: 'Temperature', pct: tempScore(c.temperature_2m, m) },
          { name: 'Humidity',    pct: humScore(c.relative_humidity_2m) },
        ];

    const fl = document.getElementById('factorsList');
    fl.innerHTML = '';
    for (const f of factors) {
      const cls = f.pct >= 70 ? 'good' : f.pct >= 40 ? 'ok' : 'bad';
      fl.innerHTML += `
        <div class="factor-row">
          <div class="factor-dot ${cls}"></div>
          <div class="factor-name">${f.name}</div>
          <div class="factor-bar-track">
            <div class="factor-bar-fill" style="width:${f.pct}%"></div>
          </div>
          <div class="factor-pct">${f.pct}</div>
        </div>`;
    }

    // Summary
    document.getElementById('summaryText').textContent =
      summaryText(score, c.temperature_2m, c.wind_speed_10m, c.relative_humidity_2m, c.weather_code, m);

    // 7-day forecast
    const fr = document.getElementById('forecastRow');
    fr.innerHTML = '';
    const scores = d.time.map((_, i) =>
      calcDailyScore(d.temperature_2m_max[i], d.temperature_2m_min[i], d.wind_speed_10m_max[i], d.weather_code[i], m)
    );
    const bestScore = Math.max(...scores);

    for (let i = 0; i < d.time.length; i++) {
      const ds = scores[i];
      const isBest = ds === bestScore;
      const dayLabel = i === 0 ? 'Today' : new Date(d.time[i] + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      fr.innerHTML += `
        <div class="forecast-day-cell${isBest ? ' best' : ''}">
          <div class="fd-name">${dayLabel}</div>
          <div class="fd-emoji">${wmo(d.weather_code[i]).emoji}</div>
          <div class="fd-score ${ratingClass(ds)}">${ds}</div>
          <div class="fd-temp">${Math.round(d.temperature_2m_max[i])}°<br/>${Math.round(d.temperature_2m_min[i])}°</div>
        </div>`;
    }
  }

  // ── API ──────────────────────────────────────────────────────────────────
  async function geocode(q) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.results?.length) throw new Error(`Can't find "${q}"`);
    return data.results[0];
  }

  async function fetchWeather(lat, lon) {
    const params = [
      `latitude=${lat}`, `longitude=${lon}`,
      'current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,visibility',
      'daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,uv_index_max',
      'timezone=auto', 'forecast_days=7',
    ].join('&');
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if (!res.ok) throw new Error('Weather API failed');
    return res.json();
  }

  // ── Load ──────────────────────────────────────────────────────────────────
  function showStatus(msg) {
    const s = document.getElementById('statusLine');
    s.textContent = msg;
    s.style.display = msg ? 'block' : 'none';
  }
  function showErr(msg) {
    const e = document.getElementById('errPanel');
    e.textContent = msg;
    e.style.display = msg ? 'block' : 'none';
  }

  async function load(q) {
    showErr('');
    showStatus('Loading…');
    document.getElementById('panel').classList.remove('visible');
    try {
      const geo  = await geocode(q);
      const data = await fetchWeather(geo.latitude, geo.longitude);
      cachedGeo  = geo;
      cachedData = data;
      document.getElementById('cityName').textContent  = `${geo.name}, ${geo.country}`;
      document.getElementById('todayDate').textContent = new Date(data.daily.time[0] + 'T12:00:00')
        .toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      showStatus('');
      document.getElementById('panel').classList.add('visible');
      render();
    } catch (err) {
      showStatus('');
      showErr(err.message);
    }
  }

  // ── Events ────────────────────────────────────────────────────────────────
  document.getElementById('searchBtn').addEventListener('click', () => {
    const q = document.getElementById('locInput').value.trim();
    if (q) load(q);
  });
  document.getElementById('locInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = document.getElementById('locInput').value.trim();
      if (q) load(q);
    }
  });

  document.getElementById('runBtn').addEventListener('click', () => {
    mode = 'run';
    document.getElementById('runBtn').classList.add('active');
    document.getElementById('bikeBtn').classList.remove('active');
    if (cachedData) render();
  });
  document.getElementById('bikeBtn').addEventListener('click', () => {
    mode = 'bike';
    document.getElementById('bikeBtn').classList.add('active');
    document.getElementById('runBtn').classList.remove('active');
    if (cachedData) render();
  });

  load('New York');
</script>
</body>
</html>
