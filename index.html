<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Fellows' Weather Safari</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --gold: #f5c518;
      --brown: #5c3317;
      --green: #2d6a4f;
      --sky: #90e0ef;
      --orange: #f4813a;
      --red: #e63946;
      --cream: #fdf8f0;
      --dark: #1a1a2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      background: linear-gradient(135deg, var(--brown) 0%, #3a1f0d 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-bottom: 5px solid var(--gold);
      position: relative;
    }
    header h1 {
      font-family: 'Fredoka One', cursive;
      color: var(--gold);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }
    .hat-icon { font-size: 2.4rem; }

    /* ── Search bar ── */
    .search-wrap {
      display: flex;
      gap: 10px;
      margin: 28px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 0 16px;
    }
    .search-wrap input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 50px;
      border: 3px solid var(--gold);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: #fff;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--orange); }
    .search-wrap button {
      padding: 13px 22px;
      border-radius: 50px;
      border: none;
      background: var(--gold);
      color: var(--brown);
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .1s, background .2s;
      white-space: nowrap;
    }
    .search-wrap button:hover { background: var(--orange); color: #fff; transform: scale(1.04); }

    /* ── Main card ── */
    .main-card {
      background: linear-gradient(160deg, #16213e 0%, #0f3460 100%);
      border: 3px solid #ffffff22;
      border-radius: 24px;
      padding: 28px 32px;
      margin: 22px 16px 0;
      width: 100%;
      max-width: 700px;
      display: none;
    }
    .main-card.visible { display: block; }

    /* ── Current weather ── */
    .current-section {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
    }
    .location-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .location-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: #fff;
    }
    .location-date { color: #aac8e4; font-size: 0.9rem; font-weight: 700; }

    .weather-icon-big { font-size: 5rem; line-height: 1; }

    .temp-block { flex: 1; min-width: 120px; }
    .temp-big {
      font-family: 'Fredoka One', cursive;
      font-size: 3.6rem;
      color: var(--gold);
      line-height: 1;
    }
    .feels-like { color: #aac8e4; font-size: 0.88rem; font-weight: 700; margin-top: 4px; }
    .condition-label {
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      width: 100%;
    }
    .detail-chip {
      background: #ffffff14;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-chip .icon { font-size: 1.3rem; }
    .detail-chip .label { color: #aac8e4; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
    .detail-chip .value { color: #fff; font-weight: 900; font-size: 0.96rem; }

    /* ── Brian Fellows speech bubble ── */
    .brian-section {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      margin-top: 26px;
      flex-wrap: wrap;
    }
    .brian-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B6914, #5c3317);
      border: 4px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      flex-shrink: 0;
      position: relative;
      overflow: visible;
    }
    .brian-avatar::after {
      content: '🎖️';
      position: absolute;
      bottom: -6px;
      right: -6px;
      font-size: 1.2rem;
    }
    .bubble {
      flex: 1;
      min-width: 200px;
      background: var(--gold);
      color: #1a0a00;
      border-radius: 18px 18px 18px 4px;
      padding: 14px 18px;
      position: relative;
      font-weight: 700;
      font-size: 0.97rem;
      line-height: 1.5;
      border: 3px solid var(--brown);
    }
    .bubble::before {
      content: '';
      position: absolute;
      left: -14px;
      bottom: 16px;
      border-width: 7px 14px 7px 0;
      border-style: solid;
      border-color: transparent var(--brown) transparent transparent;
    }
    .bubble::after {
      content: '';
      position: absolute;
      left: -10px;
      bottom: 18px;
      border-width: 5px 11px 5px 0;
      border-style: solid;
      border-color: transparent var(--gold) transparent transparent;
    }
    .bubble .catchphrase {
      display: block;
      margin-top: 8px;
      font-family: 'Fredoka One', cursive;
      color: var(--red);
      font-size: 1.05rem;
      letter-spacing: .5px;
    }

    /* ── Forecast strip ── */
    .forecast-title {
      font-family: 'Fredoka One', cursive;
      color: var(--gold);
      font-size: 1.2rem;
      margin: 26px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 10px;
    }
    .forecast-card {
      background: #ffffff0e;
      border: 2px solid #ffffff1a;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      transition: transform .15s, background .15s;
      cursor: default;
    }
    .forecast-card:hover { background: #ffffff1e; transform: translateY(-3px); }
    .forecast-card.today { border-color: var(--gold); background: #f5c51820; }
    .forecast-day { color: #aac8e4; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; margin-bottom: 6px; }
    .forecast-icon { font-size: 1.9rem; margin: 4px 0; }
    .forecast-high { color: var(--gold); font-weight: 900; font-size: 0.96rem; }
    .forecast-low { color: #aac8e4; font-weight: 700; font-size: 0.82rem; }

    /* ── Loading / error states ── */
    .status-msg {
      color: #aac8e4;
      font-weight: 700;
      text-align: center;
      margin: 40px 0;
      font-size: 1.05rem;
    }
    .status-msg .spin {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: var(--red);
      background: #e6394620;
      border: 2px solid var(--red);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 20px 16px 0;
      font-weight: 700;
      max-width: 700px;
      width: calc(100% - 32px);
      text-align: center;
    }

    /* ── Footer ── */
    footer {
      color: #ffffff30;
      font-size: 0.75rem;
      text-align: center;
      padding: 30px 16px 20px;
    }

    /* responsive */
    @media (max-width: 480px) {
      .main-card { padding: 20px 16px; }
      .temp-big { font-size: 2.8rem; }
      .detail-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span class="hat-icon">🦁</span>
  <h1>Brian Fellows' Weather Safari</h1>
  <span class="hat-icon">🌿</span>
</header>

<div class="search-wrap">
  <input type="text" id="locationInput" placeholder="Enter city (e.g. New York)" />
  <button id="searchBtn">Go Safari!</button>
</div>

<div id="errorMsg" class="error-msg" style="display:none;"></div>

<div id="mainCard" class="main-card">
  <div id="statusMsg" class="status-msg" style="display:none;">
    <span class="spin">🌍</span> Brian Fellows is surveying the weather...
  </div>

  <div id="weatherContent" style="display:none;">
    <!-- Current weather -->
    <div class="current-section">
      <div class="location-row">
        <span class="location-name" id="locationName">—</span>
        <span class="location-date" id="locationDate">—</span>
      </div>
      <div class="weather-icon-big" id="currentIcon">🌤️</div>
      <div class="temp-block">
        <div class="temp-big" id="currentTemp">—</div>
        <div class="feels-like" id="feelsLike">Feels like —</div>
        <div class="condition-label" id="conditionLabel">—</div>
      </div>
      <div class="detail-grid">
        <div class="detail-chip">
          <span class="icon">💨</span>
          <div>
            <div class="label">Wind</div>
            <div class="value" id="wind">—</div>
          </div>
        </div>
        <div class="detail-chip">
          <span class="icon">💧</span>
          <div>
            <div class="label">Humidity</div>
            <div class="value" id="humidity">—</div>
          </div>
        </div>
        <div class="detail-chip">
          <span class="icon">👁️</span>
          <div>
            <div class="label">Visibility</div>
            <div class="value" id="visibility">—</div>
          </div>
        </div>
        <div class="detail-chip">
          <span class="icon">🌡️</span>
          <div>
            <div class="label">UV Index</div>
            <div class="value" id="uvIndex">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Brian Fellows commentary -->
    <div class="brian-section">
      <div class="brian-avatar">🧑🏾</div>
      <div class="bubble">
        <span id="brianQuote">Loading Brian's thoughts...</span>
        <span class="catchphrase" id="brianCatchphrase">I'M BRIAN FELLOWS!</span>
      </div>
    </div>

    <!-- 7-day forecast -->
    <div class="forecast-title">🗓️ 7-Day Safari Forecast</div>
    <div class="forecast-grid" id="forecastGrid"></div>
  </div>
</div>

<footer>Weather data from Open-Meteo · "That's crazy!" — Brian Fellows</footer>

<script>
  // ── WMO weather code → description & emoji ──────────────────────────────
  const WMO = {
    0:  { label: 'Clear Sky',          emoji: '☀️' },
    1:  { label: 'Mostly Clear',       emoji: '🌤️' },
    2:  { label: 'Partly Cloudy',      emoji: '⛅' },
    3:  { label: 'Overcast',           emoji: '☁️' },
    45: { label: 'Foggy',              emoji: '🌫️' },
    48: { label: 'Icy Fog',            emoji: '🌫️' },
    51: { label: 'Light Drizzle',      emoji: '🌦️' },
    53: { label: 'Drizzle',            emoji: '🌦️' },
    55: { label: 'Heavy Drizzle',      emoji: '🌧️' },
    61: { label: 'Light Rain',         emoji: '🌧️' },
    63: { label: 'Rain',               emoji: '🌧️' },
    65: { label: 'Heavy Rain',         emoji: '🌧️' },
    66: { label: 'Freezing Rain',      emoji: '🌨️' },
    67: { label: 'Heavy Freezing Rain',emoji: '🌨️' },
    71: { label: 'Light Snow',         emoji: '🌨️' },
    73: { label: 'Snow',               emoji: '❄️' },
    75: { label: 'Heavy Snow',         emoji: '❄️' },
    77: { label: 'Snow Grains',        emoji: '🌨️' },
    80: { label: 'Rain Showers',       emoji: '🌦️' },
    81: { label: 'Rain Showers',       emoji: '🌧️' },
    82: { label: 'Violent Showers',    emoji: '⛈️' },
    85: { label: 'Snow Showers',       emoji: '🌨️' },
    86: { label: 'Heavy Snow Showers', emoji: '❄️' },
    95: { label: 'Thunderstorm',       emoji: '⛈️' },
    96: { label: 'Thunderstorm + Hail',emoji: '⛈️' },
    99: { label: 'Severe Thunderstorm',emoji: '🌩️' },
  };

  // ── Brian Fellows quotes ────────────────────────────────────────────────
  const BRIAN_QUOTES = {
    clear: [
      "That big ball of fire up in the sky is shinin' right in my eyes! My eyes are all big! It don't make no sense that it can do that from all the way up there!",
      "The sun is out today, and it is HOT. I think the sun knows I'm here and it is PERSONALLY tryin' to heat me up. That's not right.",
      "There ain't a cloud in the sky! Where they go?! They was just here! I don't trust it. They probably hidin' behind the sun, schemin'.",
    ],
    cloudy: [
      "Them big gray fluffy things up there are just floatin' around like they own the sky! I don't know how they stay up there. I didn't go to college but I know that ain't natural!",
      "The clouds is blockin' the sun today. They work together! They got a whole operation goin' on up there. That's crazy!",
      "It's all cloudy out. The sky looks like my grandma's carpet. Gray and heavy. I don't like it one bit.",
    ],
    fog: [
      "I can't see NOTHIN' out there! The fog is STEALIN' MY VISION! My eyes are all big! That ain't right! That ain't right at all!",
      "It's real foggy today. I walked outside and couldn't see my hand in front of my face. The fog is personal. It came HERE specifically. That's crazy!",
      "There's a big cloud on the GROUND! How'd it get down there?! It's supposed to be in the SKY! I didn't go to college but I know that ain't right!",
    ],
    drizzle: [
      "It's doin' that thing where it rains but just barely. Like the sky is thinkin' about it but ain't fully committed. Make up your mind, sky!",
      "There's this little tiny rain comin' down. It can't even rain right! The drizzle is weak. It's a coward rain. I don't respect it.",
      "The sky is spittin' on me! Just a little bit, but still! That's disrespectful! That's CRAZY!",
    ],
    rain: [
      "All that water is comin' out of the sky! WHERE IS IT COMIN' FROM?! The sky don't got no pipes! I don't understand it! My eyes are all big!",
      "It's rainin' outside and every single one of them drops is fallin' DOWN. Why don't some of them fall UP?! The rain is too comfortable just going one direction!",
      "I went outside in the rain and got WET. The rain got on me. I didn't give it permission! That's CRAZY!",
    ],
    snow: [
      "There's cold white stuff fallin' from the sky! It looks like the clouds is sheddin'! Like a big fluffy dog up there just losin' all its fur! That ain't right!",
      "The snow is everywhere! On the ground, on the trees, on MY CAR! It's coverin' everything up! The snow is hidin' things from me! I don't trust it!",
      "I picked up some snow and it turned into water in my hands! It TRANSFORMED! Right in my hand! The snow is magic and I don't appreciate it!",
    ],
    thunderstorm: [
      "The SKY is YELLIN' at me! Real loud! And then it FLASHES! The sky is ANGRY and it is PERSONALLY MAD AT ME! My eyes are all big! THAT'S CRAZY!",
      "There's lightning out there! The sky is shootin' electricity! WHERE IS IT GETTING ALL THAT ELECTRICITY FROM?! There ain't no outlet up there! I didn't go to college but I KNOW that!",
      "Thunder and lightning both came to visit today. They travel together like a crew. The sky got a whole GANG! That ain't right! That ain't right at all!",
    ],
    hot: [
      "It is SO hot out today! The air itself is hot! I breathed in and the AIR burned my lungs! The air is BETRAYING ME! That's crazy!",
      "It's real hot today. The concrete is hot, the car is hot, the AIR is hot. Everything is conspiring to heat me up. I see what's happening. I'm Brian Fellows!",
      "This heat is something else. I sweated through my shirt and the sweat is HOT too! Even my sweat is hot! That ain't supposed to happen!",
    ],
    cold: [
      "It is FREEZING out there! The cold air got in my jacket! My jacket is supposed to STOP that! The cold found a way in! It's crafty! That's crazy!",
      "The temperature is real low today. I blew on my hands to warm them up and my BREATH came out as a cloud! My body makes CLOUDS! My eyes are all big!",
      "It's cold AND windy. The cold is chasing me! Every time I turned around, there it was! The cold knows where I live! I don't appreciate that!",
    ],
    windy: [
      "The wind is pushing on my face! I can't SEE the wind but I can FEEL it! It's invisible! The invisible force is TOUCHING me! That ain't right!",
      "It's so windy today that my hat blew off! The wind TOOK my hat! I want it back! The wind is a THIEF and nobody is doing NOTHIN' about it! That's crazy!",
      "The wind is blowin' everything around. Leaves, trash, my papers — the wind don't care what it moves! It's just takin' things! It's got NO RESPECT for property!",
    ],
  };

  const CATCHPHRASES = [
    "I'M BRIAN FELLOWS!",
    "THAT'S CRAZY!",
    "MY EYES ARE ALL BIG!",
    "I DIDN'T GO TO COLLEGE!",
    "THAT AIN'T RIGHT!",
    "I'M BRIAN FELLOWS AND THIS IS MY SAFARI ADVENTURE!",
  ];

  function getBrianQuote(wmoCode, tempC, windKph) {
    const hasPrecip = [51,53,55,61,63,65,66,67,80,81,82].includes(wmoCode);
    const hasSnow   = [71,73,75,77,85,86].includes(wmoCode);
    const hasThunder= [95,96,99].includes(wmoCode);
    const hasFog    = [45,48].includes(wmoCode);
    const hasDrizzle= [51,53,55].includes(wmoCode);
    const isWind    = windKph > 30;
    const isHot     = tempC > 30;
    const isCold    = tempC < 2;
    const isClear   = [0,1].includes(wmoCode);
    const isCloudy  = [2,3].includes(wmoCode);

    let pool;
    if (hasThunder)       pool = BRIAN_QUOTES.thunderstorm;
    else if (hasSnow)     pool = BRIAN_QUOTES.snow;
    else if (hasFog)      pool = BRIAN_QUOTES.fog;
    else if (hasDrizzle)  pool = BRIAN_QUOTES.drizzle;
    else if (hasPrecip)   pool = BRIAN_QUOTES.rain;
    else if (isCold)      pool = BRIAN_QUOTES.cold;
    else if (isHot)       pool = BRIAN_QUOTES.hot;
    else if (isWind)      pool = BRIAN_QUOTES.windy;
    else if (isClear)     pool = BRIAN_QUOTES.clear;
    else if (isCloudy)    pool = BRIAN_QUOTES.cloudy;
    else                  pool = BRIAN_QUOTES.clear;

    const quote      = pool[Math.floor(Math.random() * pool.length)];
    const catchphrase= CATCHPHRASES[Math.floor(Math.random() * CATCHPHRASES.length)];
    return { quote, catchphrase };
  }

  function wmo(code) {
    return WMO[code] || { label: 'Unknown', emoji: '🌡️' };
  }

  function dayName(dateStr, index) {
    if (index === 0) return 'TODAY';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
  }

  function fmtDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  // ── API calls ───────────────────────────────────────────────────────────
  async function geocode(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.results || data.results.length === 0) throw new Error(`Brian Fellows couldn't find "${query}" on his safari map!`);
    return data.results[0];
  }

  async function fetchWeather(lat, lon) {
    const params = [
      `latitude=${lat}`,
      `longitude=${lon}`,
      'current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,visibility',
      'daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max',
      'timezone=auto',
      'forecast_days=7',
    ].join('&');
    const url = `https://api.open-meteo.com/v1/forecast?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Weather API failed. Even Brian Fellows is stumped!');
    return res.json();
  }

  // ── Render ──────────────────────────────────────────────────────────────
  function renderWeather(geo, data) {
    const c = data.current;
    const d = data.daily;

    // Current
    document.getElementById('locationName').textContent = `${geo.name}, ${geo.country}`;
    document.getElementById('locationDate').textContent  = fmtDate(d.time[0]);
    document.getElementById('currentTemp').textContent   = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('feelsLike').textContent     = `Feels like ${Math.round(c.apparent_temperature)}°C`;
    document.getElementById('conditionLabel').textContent= wmo(c.weather_code).label;
    document.getElementById('currentIcon').textContent   = wmo(c.weather_code).emoji;
    document.getElementById('wind').textContent          = `${Math.round(c.wind_speed_10m)} km/h`;
    document.getElementById('humidity').textContent      = `${c.relative_humidity_2m}%`;
    document.getElementById('visibility').textContent    = c.visibility != null ? `${(c.visibility / 1000).toFixed(1)} km` : 'N/A';
    document.getElementById('uvIndex').textContent       = d.uv_index_max[0] != null ? `${d.uv_index_max[0]}` : 'N/A';

    // Brian quote
    const { quote, catchphrase } = getBrianQuote(c.weather_code, c.temperature_2m, c.wind_speed_10m);
    document.getElementById('brianQuote').textContent      = `"${quote}"`;
    document.getElementById('brianCatchphrase').textContent = `— ${catchphrase}`;

    // Forecast
    const grid = document.getElementById('forecastGrid');
    grid.innerHTML = '';
    for (let i = 0; i < d.time.length; i++) {
      const card = document.createElement('div');
      card.className = 'forecast-card' + (i === 0 ? ' today' : '');
      card.innerHTML = `
        <div class="forecast-day">${dayName(d.time[i], i)}</div>
        <div class="forecast-icon">${wmo(d.weather_code[i]).emoji}</div>
        <div class="forecast-high">${Math.round(d.temperature_2m_max[i])}°</div>
        <div class="forecast-low">${Math.round(d.temperature_2m_min[i])}°</div>
      `;
      grid.appendChild(card);
    }
  }

  // ── Main flow ───────────────────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = `🦁 ${msg}`;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  async function search(query) {
    hideError();
    const card    = document.getElementById('mainCard');
    const status  = document.getElementById('statusMsg');
    const content = document.getElementById('weatherContent');

    card.classList.add('visible');
    status.style.display = 'block';
    content.style.display = 'none';

    try {
      const geo  = await geocode(query);
      const data = await fetchWeather(geo.latitude, geo.longitude);
      renderWeather(geo, data);
      status.style.display  = 'none';
      content.style.display = 'block';
    } catch (err) {
      card.classList.remove('visible');
      showError(err.message);
    }
  }

  document.getElementById('searchBtn').addEventListener('click', () => {
    const q = document.getElementById('locationInput').value.trim();
    if (q) search(q);
  });

  document.getElementById('locationInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = document.getElementById('locationInput').value.trim();
      if (q) search(q);
    }
  });

  // Auto-load a fun default location on start
  search('New York');
</script>
</body>
</html>
